name: CI - Build, Test, Push

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }} # owner/repo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: API - Install & Test
        working-directory: services/api
        run: |
          npm ci
          npm test

      - name: External-service - Install (optional tests)
        working-directory: services/external-service
        run: |
          npm ci
          npm test || echo "No tests yet for external-service"

      - name: Frontend - Install & Build (smoke)
        working-directory: services/frontend
        run: |
          npm ci
          npm run build

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Metadata (tags)
        id: meta
        run: |
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # -------- API --------
      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.SHA_TAG }}

      # -------- External Service --------
      - name: Build & Push External Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/external-service
          file: ./services/external-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-external:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-external:${{ steps.meta.outputs.SHA_TAG }}

      # -------- Frontend --------
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_BASE=
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.SHA_TAG }}
