name: CI/CD - DevSecOps k3s

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:

  # -------------------------
  # 1) SHIFT-LEFT SECURITY
  # -------------------------
  security_checks:
    name: Security - Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (block on secrets)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --redact --verbose

  # =========================
  # 2️⃣ TEST PHASE & SCA (npm audit)
  # =========================
  test_and_sca:
    name: Tests + SCA (npm audit)
    runs-on: ubuntu-latest
    needs: security_checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            services/api/package-lock.json
            services/external-service/package-lock.json
            services/frontend/package-lock.json

      # ----- API -----
      - name: API - Install
        working-directory: services/api
        run: npm ci

      - name: API - Tests
        working-directory: services/api
        run: npm test

      - name: API - Dependency audit (block >= high)
        working-directory: services/api
        run: npm audit --audit-level=high

      # ----- External service -----
      - name: External - Install
        working-directory: services/external-service
        run: npm ci

      - name: External - Tests (optional)
        working-directory: services/external-service
        run: npm test || echo "No tests yet for external-service"

      - name: External - Dependency audit (block >= high)
        working-directory: services/external-service
        run: npm audit --audit-level=high

      # ----- Frontend -----
      - name: Frontend - Install
        working-directory: services/frontend
        run: npm ci

      - name: Frontend - Build (smoke)
        working-directory: services/frontend
        run: npm run build

      - name: Frontend - Dependency audit (block >= high)
        working-directory: services/frontend
        run: npm audit --audit-level=high

  # =========================
  # 2️⃣ BUILD & PUSH IMAGES
  # =========================
  build_and_push:
    name: Build & Push Images (GHCR)
    runs-on: ubuntu-latest
    needs: tests_and_sca
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------- API --------
      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.sha_tag }}

      # -------- External Service --------
      - name: Build & Push External Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/external-service
          file: ./services/external-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-external:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-external:${{ steps.meta.outputs.sha_tag }}

      # -------- Frontend --------
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_BASE=
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.sha_tag }}

  # ---------------------------------------
  # 4) IMAGE SCAN (TRIVY) - BLOCKING
  # ---------------------------------------
  image_scan:
    name: Image Scan (Trivy) - block HIGH/CRITICAL
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.19.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ needs.build_and_push.outputs.sha_tag }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan External image
        uses: aquasecurity/trivy-action@0.19.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-external:${{ needs.build_and_push.outputs.sha_tag }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan Frontend image
        uses: aquasecurity/trivy-action@0.19.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ needs.build_and_push.outputs.sha_tag }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  # =========================
  # 3️⃣ UPDATE KUSTOMIZE (CD)
  # =========================
  update_manifests:
    name: CD - Update Kustomize Tags
    runs-on: ubuntu-latest
    needs: image_scan
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update image tags in Kustomize overlay
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          FILE="infra/k3s/overlays/prod/kustomization.yaml"

          echo "Updating images to tag: $SHA_TAG"

          # Update API
          sed -i "/name: devsecops-api/{n; n; s/newTag:.*/newTag: ${SHA_TAG}/}" $FILE

          # Update External
          sed -i "/name: devsecops-external/{n; n; s/newTag:.*/newTag: ${SHA_TAG}/}" $FILE

          # Update Frontend
          sed -i "/name: devsecops-frontend/{n; n; s/newTag:.*/newTag: ${SHA_TAG}/}" $FILE

          echo "Updated file content:"
          cat $FILE

      - name: Commit & Push changes
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add infra/k3s/overlays/prod/kustomization.yaml
          git commit -m "CD: deploy ${GITHUB_SHA::7}" || echo "No changes"
          git push
