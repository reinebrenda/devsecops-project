name: CI/CD - DevSecOps k3s

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:

  # =========================
  # 1️⃣ TEST PHASE
  # =========================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            services/api/package-lock.json
            services/external-service/package-lock.json
            services/frontend/package-lock.json

      # API tests
      - name: Install & Test API
        working-directory: services/api
        run: |
          npm ci
          npm test

      # External service (optional tests)
      - name: Install External Service
        working-directory: services/external-service
        run: |
          npm ci
          npm test || echo "No tests yet"

      # Frontend build check
      - name: Install & Build Frontend
        working-directory: services/frontend
        run: |
          npm ci
          npm run build

  # =========================
  # 2️⃣ BUILD & PUSH IMAGES
  # =========================
  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------- API --------
      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.sha_tag }}

      # -------- External Service --------
      - name: Build & Push External Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/external-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-external:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-external:${{ steps.meta.outputs.sha_tag }}

      # -------- Frontend --------
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./services/frontend
          push: true
          build-args: |
            REACT_APP_API_BASE=
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.sha_tag }}

  # =========================
  # 3️⃣ UPDATE KUSTOMIZE (CD)
  # =========================
  update_manifests:
    needs: build_and_push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update kustomize image tags
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"

          sed -i "0,/newTag:/s/newTag:.*/newTag: ${SHA_TAG}/" infra/k3s/overlays/prod/kustomization.yaml
          sed -i "0,/newTag:/s/newTag:.*/newTag: ${SHA_TAG}/" infra/k3s/overlays/prod/kustomization.yaml
          sed -i "0,/newTag:/s/newTag:.*/newTag: ${SHA_TAG}/" infra/k3s/overlays/prod/kustomization.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"

          git add infra/k3s/overlays/prod/kustomization.yaml
          git commit -m "CD: Deploy ${GITHUB_SHA::7}" || echo "No changes to commit"
          git push
